  <!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" id="metaTheme" />
    <script>
      // Aplica o tema salvo (ou a preferência do sistema) antes da página renderizar
      (function () {
        var t = null;
        try { t = localStorage.getItem("educonnect-theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <title>EduConnect · Portal do Aluno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="EduConnect.jpg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
      :root {
        --bg: #ffffff;
        --sec-bg: #ebf5ff;
        --bd: #e2e8f0;
        --ink: #252641;
        --mu: #696984;
        --pr: #49bbbd;
        --pr-dk: #3aa3a5;
        --navy: #252641;
        --ok: #10b981;
        --wa: #f59e0b;
        --bad: #ef4444;
        --surface: #ffffff;
        --hover: #f8fafc;
        --soft: #f1f5f9;
        --track: #e2e8f0;
        --bd-strong: #cbd5e1;
        --card-bd: rgba(37, 38, 65, 0.07);
        --topbar-bg: rgba(255, 255, 255, 0.96);
        --topbar-bd: rgba(37, 38, 65, 0.08);
        --chip-bg: rgba(255, 255, 255, 0.95);
        color-scheme: light;
        box-sizing: border-box;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 "Poppins", system-ui, sans-serif;
        overflow-x: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      input,
      select,
      textarea {
        font: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--pr);
        outline-offset: 2px;
      }

      /* Top Header (No Sidebar) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--topbar-bg);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--topbar-bd);
        transition: all 0.2s;
      }
      .nav-pill {
        padding: 8px 14px;
        border-radius: 99px;
        font-weight: 500;
        font-size: 13.5px;
        color: var(--mu);
        background: transparent;
        border: 0;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .nav-pill:hover {
        color: var(--pr);
        background: rgba(73, 187, 189, 0.08);
      }
      .nav-pill.on {
        background: var(--pr);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 6px 16px -4px rgba(73, 187, 189, 0.5);
      }

      /* Hero Curved Section inspired by reference layout */
      .hero-curve {
        position: relative;
        background: linear-gradient(125deg, #252641 0%, #2f486d 48%, #49bbbd 100%);
        color: #fff;
        border-bottom-left-radius: 50% 42px;
        border-bottom-right-radius: 50% 42px;
        overflow: hidden;
      }
      .hero-banner-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.35;
        pointer-events: none;
      }
      .glass-chip {
        background: var(--chip-bg);
        backdrop-filter: blur(10px);
        color: var(--ink);
        border-radius: 16px;
        box-shadow: 0 14px 30px rgba(37, 38, 65, 0.16);
      }

      /* Cards & Surfaces */
      .card {
        background: var(--surface);
        border: 1px solid var(--card-bd);
        border-radius: 20px;
        box-shadow: 0 10px 30px -10px rgba(37, 38, 65, 0.08);
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .card-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 36px -12px rgba(37, 38, 65, 0.14);
      }
      .sec-band {
        background: var(--sec-bg);
        border-radius: 28px;
      }
      .mu {
        color: var(--mu);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        padding: 10px 18px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        background: var(--surface);
        font-weight: 600;
        font-size: 13px;
        transition: all 0.2s;
        color: var(--ink);
      }
      .btn:hover {
        background: var(--hover);
        border-color: var(--bd-strong);
      }
      .btn.p {
        background: var(--pr);
        border-color: var(--pr);
        color: #fff;
        box-shadow: 0 6px 16px -4px rgba(73, 187, 189, 0.45);
      }
      .btn.p:hover {
        background: var(--pr-dk);
        border-color: var(--pr-dk);
      }
      .btn.navy {
        background: var(--navy);
        border-color: var(--navy);
        color: #fff;
      }
      .btn.navy:hover {
        background: #1b1c33;
      }
      .btn.d {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }

      .sp {
        width: 16px;
        height: 16px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: r 0.7s linear infinite;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }

      /* Badges */
      .b {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 12px;
        border-radius: 99px;
        font-size: 11.5px;
        font-weight: 600;
      }
      .b-ok {
        background: #d1fae5;
        color: #047857;
      }
      .b-wa {
        background: #fef3c7;
        color: #b45309;
      }
      .b-bad {
        background: #fee2e2;
        color: #b91c1c;
      }
      .b-in {
        background: rgba(73, 187, 189, 0.16);
        color: #218385;
      }

      /* Progress Bar */
      .pb {
        height: 8px;
        border-radius: 99px;
        background: var(--track);
        position: relative;
        overflow: visible;
      }
      .pb i {
        display: block;
        height: 100%;
        border-radius: 99px;
        transition: width 0.5s;
      }

      .view {
        display: none;
      }
      .view.on {
        display: block;
        animation: f 0.25s;
      }
      @keyframes f {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .cov {
        width: 100%;
        aspect-ratio: 16/8.5;
        object-fit: cover;
        display: block;
      }
      .in {
        width: 100%;
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 10px 14px;
        background: var(--surface);
        transition: all 0.2s;
      }
      .in:focus {
        border-color: var(--pr);
        outline: 0;
        box-shadow: 0 0 0 3px rgba(73, 187, 189, 0.2);
      }

      /* Modals & Overlays */
      .ovl {
        position: fixed;
        inset: 0;
        background: rgba(37, 38, 65, 0.55);
        backdrop-filter: blur(4px);
        z-index: 60;
        display: none;
        place-items: center;
        padding: 16px;
      }
      .ovl.o {
        display: grid;
      }
      .md {
        background: var(--surface);
        border-radius: 22px;
        width: min(520px, 100%);
        max-height: 90vh;
        overflow: auto;
        padding: 26px;
        animation: f 0.2s;
      }

      /* Schedule Grid */
      .sch {
        display: grid;
        grid-template-columns: 40px repeat(5, 1fr);
        gap: 4px;
        font-size: 11px;
        min-width: 300px;
      }
      .sch > div {
        min-height: 40px;
        background: var(--soft);
        border-radius: 8px;
        padding: 4px 6px;
      }
      .sch .h {
        background: none;
        min-height: 0;
        text-align: center;
        color: var(--mu);
        font-weight: 600;
      }
      .sch .c {
        background: var(--pr);
        color: #fff;
        font-weight: 600;
      }

      /* Toasts */
      .tw {
        position: fixed;
        top: 82px;
        right: 18px;
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .t {
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--navy);
        color: #fff;
        padding: 12px 18px;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(37, 38, 65, 0.28);
        animation: f 0.25s;
        max-width: 350px;
      }

      .g2 {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 350px;
        gap: 24px;
      }
      .g3 {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 20px;
      }
      @media (max-width: 1023px) {
        .g2,
        .g3 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .pop {
        position: absolute;
        right: 0;
        top: 48px;
        width: 340px;
        max-width: calc(100vw - 24px);
        background: var(--surface);
        border: 1px solid var(--bd);
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(37, 38, 65, 0.18);
        display: none;
        z-index: 50;
      }
      .pop.o {
        display: block;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Botão de alternar tema */
      .theme-btn {
        position: relative;
        overflow: hidden;
      }
      .theme-btn svg {
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
      }
      .theme-btn:hover svg {
        transform: rotate(18deg) scale(1.08);
      }
      .theme-btn .ico-sun {
        display: none;
      }
      html[data-theme="dark"] .theme-btn .ico-sun {
        display: block;
      }
      html[data-theme="dark"] .theme-btn .ico-moon {
        display: none;
      }
      .theme-anim,
      .theme-anim *,
      .theme-anim *::before,
      .theme-anim *::after {
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease !important;
      }

      /* ===================== TEMA ESCURO ===================== */
      @media not print {
        html[data-theme="dark"] {
          --bg: #0f1020;
          --sec-bg: #1c1e3a;
          --bd: #34365a;
          --bd-strong: #4a4d78;
          --ink: #e8e9f5;
          --mu: #a2a4c0;
          --surface: #191a31;
          --hover: #222446;
          --soft: #24264a;
          --track: #2c2e52;
          --card-bd: rgba(255, 255, 255, 0.08);
          --topbar-bg: rgba(15, 16, 32, 0.92);
          --topbar-bd: rgba(255, 255, 255, 0.08);
          --chip-bg: rgba(25, 26, 49, 0.94);
          color-scheme: dark;
        }
        html[data-theme="dark"] .card {
          box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        html[data-theme="dark"] .card-hover:hover {
          box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.6);
        }
        html[data-theme="dark"] .glass-chip {
          box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        }
        html[data-theme="dark"] .btn.navy {
          background: #34376b;
          border-color: #34376b;
        }
        html[data-theme="dark"] .btn.navy:hover {
          background: #40448a;
        }
        html[data-theme="dark"] .t {
          background: #2b2e5a;
          border: 1px solid rgba(255, 255, 255, 0.12);
        }
        html[data-theme="dark"] .ovl {
          background: rgba(5, 6, 15, 0.7);
        }
        html[data-theme="dark"] .pop {
          box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
        }
        html[data-theme="dark"] .b-ok {
          background: rgba(16, 185, 129, 0.18);
          color: #6ee7b7;
        }
        html[data-theme="dark"] .b-wa {
          background: rgba(245, 158, 11, 0.18);
          color: #fcd34d;
        }
        html[data-theme="dark"] .b-bad {
          background: rgba(239, 68, 68, 0.2);
          color: #fca5a5;
        }
        html[data-theme="dark"] .b-in {
          background: rgba(73, 187, 189, 0.2);
          color: #7fdcde;
        }
        html[data-theme="dark"] .in::placeholder {
          color: #7f819f;
        }
        html[data-theme="dark"] .nav-pill:hover {
          background: rgba(73, 187, 189, 0.14);
        }
        html[data-theme="dark"] ::-webkit-scrollbar-thumb {
          background: #3a3d68;
          border-radius: 8px;
        }

        /* Classes utilitárias do Tailwind usadas com cores fixas (modo claro) */
        html[data-theme="dark"] .text-\[\#252641\] {
          color: var(--ink) !important;
        }
        html[data-theme="dark"] .mbg {
          color: #252641 !important;
        }
        html[data-theme="dark"] .text-\[\#696984\] {
          color: var(--mu) !important;
        }
        html[data-theme="dark"] .text-\[\#218385\] {
          color: #7fdcde !important;
        }
        html[data-theme="dark"] .bg-white:not(#footerLogo),
        html[data-theme="dark"] .bg-white\/95 {
          background-color: var(--surface) !important;
        }
        html[data-theme="dark"] .bg-slate-50\/80,
        html[data-theme="dark"] .bg-slate-50\/60,
        html[data-theme="dark"] .bg-slate-100 {
          background-color: var(--soft) !important;
        }
        html[data-theme="dark"] .hover\:bg-slate-50:hover,
        html[data-theme="dark"] .hover\:bg-slate-100:hover {
          background-color: var(--hover) !important;
        }
        html[data-theme="dark"] .bg-\[\#ebf5ff\] {
          background-color: var(--sec-bg) !important;
        }
        html[data-theme="dark"] main .bg-\[\#252641\] {
          background-color: #256f72 !important;
        }
        html[data-theme="dark"] .bg-emerald-100 {
          background-color: rgba(16, 185, 129, 0.18) !important;
        }
        html[data-theme="dark"] .bg-amber-100 {
          background-color: rgba(245, 158, 11, 0.18) !important;
        }
        html[data-theme="dark"] .bg-sky-100 {
          background-color: rgba(14, 165, 233, 0.18) !important;
        }
        html[data-theme="dark"] .bg-teal-100 {
          background-color: rgba(73, 187, 189, 0.2) !important;
        }
        html[data-theme="dark"] .text-emerald-600 {
          color: #34d399 !important;
        }
        html[data-theme="dark"] .text-amber-600 {
          color: #fbbf24 !important;
        }
        html[data-theme="dark"] .text-sky-600 {
          color: #38bdf8 !important;
        }
        html[data-theme="dark"] .text-slate-500 {
          color: #9ea1bf !important;
        }
        html[data-theme="dark"] .hover\:text-red-600:hover {
          color: #f87171 !important;
        }
        html[data-theme="dark"] .border-slate-100,
        html[data-theme="dark"] .border-slate-200,
        html[data-theme="dark"] .hover\:border-slate-200:hover {
          border-color: var(--bd) !important;
        }
        /* Bordas padrão do Tailwind (#e5e7eb) → cor de borda do tema */
        html[data-theme="dark"] [class*="border"]:not([class*="border-["]):not([class*="border-white"]):not([class*="border-transparent"]) {
          border-color: var(--bd);
        }
        /* Estilos inline com cores claras */
        html[data-theme="dark"] [style*="#FFFBEB"] {
          background: rgba(245, 158, 11, 0.12) !important;
          border-color: rgba(245, 158, 11, 0.45) !important;
        }
        html[data-theme="dark"] [style*="#ECFDF5"] {
          background: rgba(16, 185, 129, 0.12) !important;
          border-color: rgba(16, 185, 129, 0.45) !important;
        }
        html[data-theme="dark"] [style*="#B91C1C"] {
          color: #f87171 !important;
        }
      }
      @media print {
        body > *:not(.ovl) {
          display: none !important;
        }
        .ovl {
          position: static;
          background: none;
          display: block;
        }
        .np {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Navigation Header (No Sidebar) -->
    <header class="topbar">
      <div class="max-w-[1360px] mx-auto px-4 md:px-8 h-[72px] flex items-center gap-4">
        <!-- Brand Logo -->
        <button onclick="go('dash')" class="flex items-center gap-2.5 text-left flex-none group">
          <img
            id="brandLogo"
            alt="Logo EduConnect"
            class="w-10 h-10 rounded-xl object-cover border border-slate-200 shadow-sm group-hover:scale-105 transition"
          />
          <div class="leading-tight">
            <span class="font-extrabold text-[17px] tracking-tight text-[#252641] block">
              <span class="text-[#49BBBD]">EduConnect</span>
            </span>
            <small class="text-[11px] text-[#696984] font-medium block">Portal do Aluno</small>
          </div>
        </button>

        <!-- Horizontal Desktop Navigation -->
        <nav id="topNav" class="hidden xl:flex items-center gap-1 mx-auto"></nav>

        <!-- Right Controls: Search, Notifications, User Profile, Logout -->
        <div class="flex items-center gap-2.5 ml-auto xl:ml-0">
          <button
            id="sk"
            class="btn !py-2 !px-3.5 !rounded-full mu !font-normal text-xs hidden sm:inline-flex items-center gap-2 bg-slate-50/80"
          >
            <i data-lucide="search" class="w-4 h-4 text-[#49BBBD]"></i>
            <span>Buscar...</span>
            <kbd class="text-[10px] border rounded px-1.5 bg-white">Ctrl K</kbd>
          </button>
          <button
            id="skMob"
            onclick="srch()"
            class="btn !p-2.5 sm:hidden"
            aria-label="Buscar"
          >
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>

          <button
            id="themeBtn"
            class="btn theme-btn !p-2.5"
            type="button"
            aria-label="Ativar tema escuro"
            title="Ativar tema escuro"
          >
            <i data-lucide="moon" class="w-4 h-4 ico-moon"></i>
            <i data-lucide="sun" class="w-4 h-4 ico-sun"></i>
          </button>

          <div class="relative">
            <button class="btn !p-2.5 relative" id="bl" aria-label="Notificações">
              <i data-lucide="bell" class="w-4 h-4"></i>
              <span
                id="bc"
                class="absolute -top-1 -right-1 min-w-[18px] h-[18px] rounded-full bg-red-500 text-white text-[10px] font-bold grid place-items-center"
              ></span>
            </button>
            <div class="pop" id="pp"></div>
          </div>

          <button
            id="a1b"
            class="flex items-center gap-2 pl-1.5 pr-3 py-1 rounded-full hover:bg-slate-100 transition border border-transparent hover:border-slate-200"
            aria-label="Meu perfil"
          >
            <img id="a1" class="w-8 h-8 rounded-full object-cover" alt="Foto de Aluno" />
            <span class="hidden md:inline text-xs font-semibold text-[#252641]">Aluno</span>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 hidden md:inline"></i>
          </button>

          <button
            id="lo"
            class="btn !p-2.5 text-slate-500 hover:text-red-600"
            title="Sair da conta"
            aria-label="Sair da conta"
          >
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Horizontal Scrollable Nav for Mobile/Tablet -->
      <div class="xl:hidden border-t border-slate-100 bg-white/95 px-4 py-2 overflow-x-auto no-scrollbar">
        <nav id="mobNav" class="flex items-center gap-1.5 min-w-max"></nav>
      </div>
    </header>

    <!-- Dynamic Hero / Page Header -->
    <div id="heroArea"></div>

    <!-- Main Container -->
    <main class="px-4 md:px-8 py-8 max-w-[1360px] mx-auto w-full" id="main">
      <section class="view on" id="v-dash"></section>
      <section class="view" id="v-notas"></section>
      <section class="view" id="v-agenda"></section>
      <section class="view" id="v-mat"></section>
      <section class="view" id="v-fin"></section>
      <section class="view" id="v-bib"></section>
      <section class="view" id="v-msg"></section>
      <section class="view" id="v-perfil"></section>
    </main>

    <!-- Footer inspired by reference dark navy footer -->
    <footer class="bg-[#252641] text-white mt-16 py-12 px-4 md:px-8">
      <div class="max-w-[1360px] mx-auto flex flex-col items-center text-center">
        <div class="flex items-center gap-3 mb-4">
          <img id="footerLogo" alt="EduConnect" class="w-10 h-10 rounded-xl object-cover bg-white p-0.5" />
          <div class="text-left border-l border-white/20 pl-3">
            <b class="text-base block">EduConnect</b>
            <small class="text-slate-300 text-xs">Ambiente Virtual de Aprendizagem</small>
          </div>
        </div>
        <p class="text-slate-400 text-xs max-w-md mb-6">
          Plataforma integrada de gestão acadêmica, acompanhamento de desempenho e serviços universitários.
        </p>
        <div class="flex flex-wrap justify-center gap-6 text-xs text-slate-300 mb-6">
          <button onclick="go('dash')" class="hover:text-[#49BBBD]">Visão Geral</button>
          <button onclick="go('notas')" class="hover:text-[#49BBBD]">Notas e Faltas</button>
          <button onclick="go('agenda')" class="hover:text-[#49BBBD]">Agenda</button>

          btn.setAttribute("aria-label", label);
          btn.setAttribute("title", label);
          btn.setAttribute("aria-pressed", String(dark));
          if (meta) meta.setAttribute("content", dark ? "#0f1020" : "#ffffff");
        }

        apply(root.getAttribute("data-theme") || "light");

        btn.addEventListener("click", () => {
          const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.classList.add("theme-anim");
          apply(next);
          try { localStorage.setItem(KEY, next); } catch (e) {}
          setTimeout(() => root.classList.remove("theme-anim"), 350);

        // Se a pessoa nunca escolheu, acompanha a preferência do sistema

            if (!saved) apply(e.matches ? "dark" : "light");
          });
        }

        "2026-11-27": [["Prova · Arquitetura de Computadores", "bad"]],
        "2026-12-01": [["Abertura da rematrícula 2027.1", "in"]],
        "2026-12-10": [["Prazo final · TCC I", "wa"]],
      };
      const kd = (y, m, d) =>
          y +
          "-" +
          String(m + 1).padStart(2, "0") +
          "-" +
          String(d).padStart(2, "0"),
        T0 = new Date(),
        TK = kd(T0.getFullYear(), T0.getMonth(), T0.getDate());
      let cy = 2026,
        cmo = 10,
        csel = "2026-11-12";
      function agenda() {
        const f0 = new Date(cy, cmo, 1).getDay(),
          n = new Date(cy, cmo + 1, 0).getDate();
        let c = "";
        for (let i = 0; i < f0; i++) c += "<div></div>";
        for (let d = 1; d <= n; d++) {
          const k = kd(cy, cmo, d),
            e = EV[k] || [],
            s = k === csel;
          c += `<button data-k="${k}" class="aspect-square rounded-2xl border text-sm transition flex flex-col items-center justify-center gap-0.5 ${s ? "bg-[#49BBBD] text-white border-[#49BBBD] shadow-md" : k === TK ? "border-[#49BBBD] text-[#218385] font-bold" : "bg-white hover:bg-slate-50"}" ${s || k === TK ? "" : 'style="border-color:var(--bd)"'}>${d}<span class="flex gap-0.5 h-1.5">${e.map((x) => `<i class="w-1.5 h-1.5 rounded-full" style="background:${s ? "#fff" : DC[x[1]]}"></i>`).join("")}</span></button>`;
        }
        const se = EV[csel] || [],
          up = Object.keys(EV)
            .sort()
            .filter((k) => k >= TK)
            .slice(0, 6),
          fm2 = (k) => k.slice(8) + "/" + k.slice(5, 7),
          row = (k, x) =>
            `<div class="flex gap-3 items-start py-2 text-xs"><i class="w-2.5 h-2.5 rounded-full mt-1 flex-none" style="background:${DC[x[1]]}"></i><span>${x[0]}${k ? `<small class="mu block">${fm2(k)}</small>` : ""}</span></div>`;
        $("#v-agenda").innerHTML =
          `<div class="g2"><div class="card p-6"><div class="flex items-center justify-between mb-4"><h3 class="text-lg font-extrabold">${MN[cmo]} ${cy}</h3><div class="flex gap-2"><button class="btn !p-2" data-m="-1" aria-label="Mês anterior">${ic("chevron-left")}</button><button class="btn !p-2" data-m="1" aria-label="Próximo mês">${ic("chevron-right")}</button></div></div><div class="grid grid-cols-7 gap-1.5 text-center mu text-xs mb-1.5">${["D", "S", "T", "Q", "Q", "S", "S"].map((x) => `<span>${x}</span>`).join("")}</div><div class="grid grid-cols-7 gap-1.5">${c}</div></div><div class="flex flex-col gap-4 self-start"><div class="card p-5"><b>Dia ${fm2(csel)}</b><div class="mt-2">${se.map((x) => row("", x)).join("") || '<p class="mu text-xs mt-1">Nenhum compromisso neste dia.</p>'}</div></div><div class="card p-5"><b>Próximos eventos</b><div class="mt-2">${up.map((k) => EV[k].map((x) => row(k, x)).join("")).join("")}</div></div></div></div>`;
        $$("[data-k]").forEach(
          (b) =>
            (b.onclick = () => {
              csel = b.dataset.k;
              agenda();
            }),
        );
        $$("[data-m]").forEach(
          (b) =>
            (b.onclick = () => {
              cmo += +b.dataset.m;
              if (cmo < 0) {
                cmo = 11;
                cy--;
              }
              if (cmo > 11) {
                cmo = 0;
                cy++;
              }
              agenda();
            }),
        );
        ri();
      }

      // Financeiro
      const PA = MN.map((m, i) => ({
        m,
        v:
          (i === 10 ? "20" : "10") +
          "/" +
          String(i + 1).padStart(2, "0") +
          "/2026",
        s: i < 10 ? "Pago" : i === 10 ? "Aberto" : "A vencer",
      }));
      const LD = "34191.79001 01043.510047 91020.150008 8 97650000148000",
        PX =
          "00020126580014br.gov.bcb.pix0136financeiro@EduConnect.edu.br5204000053039865406148.005802BR";
      function fm(i) {
        const p = PA[i];
        if (p.s === "Pago")
          return mod(
            `<h3 class="text-xl font-extrabold">Recibo · ${p.m}/2026</h3><p class="mu text-xs my-3">Pagamento de R$ 1.480,00 confirmado via PIX.</p><div class="flex justify-end"><button class="btn p" onclick="cm()">Fechar</button></div>`,
          );
        mod(
          `<h3 class="text-xl font-extrabold">Boleto · ${p.m}/2026</h3><p class="mu text-xs">Vencimento <b>${p.v}</b> · R$ 1.480,00</p><small class="mu block mt-4 text-xs">Linha digitável</small><div class="p-3 rounded-xl bg-slate-100 text-xs break-all font-mono mt-1">${LD}</div><div class="flex flex-wrap gap-2 mt-4"><button class="btn p" data-cp="${LD}">${ic("copy")}Copiar linha digitável</button><button class="btn" data-cp="${PX}">${ic("qr-code")}Copiar PIX</button></div><div class="flex gap-2 justify-end mt-5"><button class="btn" id="sv2">Gerar 2ª via</button><button class="btn" onclick="cm()">Fechar</button></div>`,
        );
        $$("[data-cp]").forEach((b) => (b.onclick = () => cp(b.dataset.cp)));
        $("#sv2").onclick = (e) =>
          ld(e.currentTarget, 1100, () =>
            toast("2ª via gerada e enviada ao seu e-mail"),
          );
      }
      function fin() {
        $("#v-fin").innerHTML =
          `<div class="grid gap-4 sm:grid-cols-3 mb-6"><div class="card p-5"><small class="mu text-xs">Pago em 2026</small><b class="block text-2xl mt-1">R$ 14.800,00</b><span class="b b-ok mt-2">10 parcelas</span></div><div class="card p-5"><small class="mu text-xs">Em aberto</small><b class="block text-2xl mt-1">R$ 1.480,00</b><button class="btn p !py-1.5 mt-2" data-f="10">${ic("qr-code")}Pagar com PIX</button></div><div class="card p-5"><small class="mu text-xs">Bolsa de mérito</small><b class="block text-2xl mt-1">20%</b><span class="b b-in mt-2">Ativa até 12/2026</span></div></div><div class="card p-6"><b class="text-base">Mensalidades 2026</b><div class="overflow-x-auto mt-3"><table class="w-full min-w-[560px] text-left text-xs"><thead class="mu"><tr><th class="py-2.5">Competência</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${PA.map((p, i) => `<tr class="border-t" style="border-color:var(--bd)"><td class="py-3 font-semibold">${p.m}</td><td>${p.v}</td><td>R$ 1.480,00</td><td><span class="b ${p.s === "Pago" ? "b-ok" : p.s === "Aberto" ? "b-wa" : "b-in"}">${p.s}</span></td><td class="text-right"><button class="btn !py-1.5 !px-3.5" data-f="${i}">${p.s === "Pago" ? "Recibo" : "Ver boleto"}</button></td></tr>`).join("")}</tbody></table></div></div>`;
        $$("[data-f]").forEach((b) => (b.onclick = () => fm(+b.dataset.f)));
        ri();
      }

      // Biblioteca
      const BK = [
        [
          1,
          "Algoritmos: Teoria e Prática",
          "Cormen et al.",
          "Algoritmos",
          "code",
          "#252641",
          "#49BBBD",
          3,
        ],
        [
          2,
          "Arquitetura de Computadores",
          "Hennessy, Patterson",
          "Hardware",
          "chip",
          "#134E4A",
          "#49BBBD",
          0,
        ],
        [
          3,
          "Engenharia de Software",
          "Ian Sommerville",
          "Engenharia",
          "chart",
          "#1E3A8A",
          "#38BDF8",
          5,
        ],
        [
          4,
          "Redes de Computadores",
          "Tanenbaum",
          "Redes",
          "net",
          "#064E3B",
          "#10B981",
          2,
        ],
        [
          5,
          "Cálculo Numérico",
          "Ruggiero",
          "Matemática",
          "math",
          "#334155",
          "#0EA5E9",
          4,
        ],
        [
          6,
          "Sistemas de Banco de Dados",
          "Elmasri, Navathe",
          "Dados",
          "code",
          "#0C4A6E",
          "#38BDF8",
          1,
        ],
        [
          7,
          "Código Limpo",
          "Robert C. Martin",
          "Engenharia",
          "chart",
          "#9A3412",
          "#F59E0B",
          0,
        ],
        [
          8,
          "Inteligência Artificial",
          "Russell, Norvig",
          "Algoritmos",
          "net",
          "#14532D",
          "#49BBBD",
          6,
        ],
      ].map((a) => ({
        id: a[0],
        t: a[1],
        a: a[2],
        c: a[3],
        img: cov(a[4], a[5], a[6]),
        ex: a[7],
      }));
      const dd = (n) => {
          const d = new Date();
          d.setDate(d.getDate() + n);
          return d;
        },
        fd = (d) => d.toLocaleDateString("pt-BR"),
        LN = { 1: { due: dd(2), r: 0 }, 6: { due: dd(13), r: 1 } },
        RS = new Set([2]);
      let bq = "",
        bcat = "Todas";
      function bib() {
        $("#v-bib").innerHTML =
          `<div class="g2"><div class="min-w-0"><input id="bs" class="in mb-3 text-xs" placeholder="Buscar por título ou autor" value="${bq}"><div class="flex flex-wrap gap-2 mb-4">${["Todas", ...new Set(BK.map((b) => b.c))].map((c) => `<button class="btn !py-1.5 !px-3.5 ${c === bcat ? "p" : ""}" data-bc="${c}">${c}</button>`).join("")}</div><div id="bk" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></div></div><div class="card p-5 self-start"><b class="text-base">Meus empréstimos</b><div id="ln" class="mt-3"></div></div></div>`;
        $("#bs").oninput = (e) => {
          bq = e.target.value;
          blist();
        };
        $$("[data-bc]").forEach(
          (b) =>
            (b.onclick = () => {
              bcat = b.dataset.bc;
              bib();
            }),
        );
        blist();
        ri();
      }
      function blist() {
        const L = BK.filter(
          (b) =>
            (bcat === "Todas" || b.c === bcat) &&
            (b.t + b.a).toLowerCase().includes(bq.toLowerCase()),
        );
        $("#bk").innerHTML =
          L.map((b) => {
            const l = LN[b.id],
              r = RS.has(b.id);
            return `<div class="card overflow-hidden card-hover"><img class="cov" src="${b.img}" alt="Capa de ${b.t}"><div class="p-4"><b>${b.t}</b><small class="mu block">${b.a} · ${b.c}</small><span class="b ${l ? "b-in" : b.ex > 0 ? "b-ok" : "b-bad"} mt-2">${l ? "Com você" : b.ex > 0 ? b.ex + " exemplares" : "Indisponível"}</span><button class="btn ${b.ex > 0 && !l ? "p" : ""} w-full mt-3 !py-2" data-b="${b.id}" ${l || (r && b.ex === 0) ? "disabled" : ""}>${l ? "Emprestado" : b.ex > 0 ? "Emprestar" : r ? "Reservado" : "Reservar"}</button></div></div>`;
          }).join("") || '<p class="mu text-xs">Nenhum livro encontrado.</p>';
        $("#ln").innerHTML =
          Object.keys(LN)
            .map((k) => {
              const b = BK.find((x) => x.id == k),
                l = LN[k],
                n = Math.ceil((l.due - new Date()) / 864e5);
              return `<div class="py-3 border-t text-xs" style="border-color:var(--bd)"><b class="block">${b.t}</b><small class="mu">Devolução em ${fd(l.due)}</small> <span class="b ${n <= 3 ? "b-wa" : "b-ok"}">${n} dia(s)</span><div class="flex gap-2 mt-2"><button class="btn !py-1 !px-3" data-r="${k}" ${l.r >= 2 ? "disabled" : ""}>Renovar (${2 - l.r})</button><button class="btn !py-1 !px-3" data-dv="${k}">Devolver</button></div></div>`;
            })
            .join("") || '<p class="mu text-xs">Nenhum empréstimo ativo.</p>';
        $$("[data-b]").forEach(
          (b) =>
            (b.onclick = () => {
              const k = +b.dataset.b,
                bk = BK.find((x) => x.id === k);
              ld(b, 900, () => {
                if (bk.ex > 0) {
                  bk.ex--;
                  LN[k] = { due: dd(14), r: 0 };
                  toast(
                    "Empréstimo registrado · devolução em " + fd(LN[k].due),
                  );
                } else {
                  RS.add(k);
                  toast("Reserva registrada. Avisaremos quando chegar.");
                }
                blist();
              });
            }),
        );
        $$("[data-r]").forEach(
          (b) =>
            (b.onclick = () => {
              const k = b.dataset.r;
              ld(b, 900, () => {
                LN[k].due = new Date(LN[k].due.getTime() + 7 * 864e5);
                LN[k].r++;
                toast("Renovado até " + fd(LN[k].due));
                blist();
              });
            }),
        );
        $$("[data-dv]").forEach(
          (b) =>
            (b.onclick = () => {
              const k = b.dataset.dv;
              ld(b, 900, () => {
                BK.find((x) => x.id == k).ex++;
                delete LN[k];
                toast("Devolução registrada");
                blist();
              });
            }),
        );
        ri();
      }

      // Mensagens
      const MG = [
        {
          id: 1,
          fr: "Prof. Ricardo Salles",
          sj: "Nota da P2 disponível",
          bd: "Olá, Aluno! As notas da P2 de Banco de Dados já estão no portal. Atendimento para revisão na quarta, às 14h, no Lab 12.",
          tm: "Hoje, 09:41",
          rd: 0,
          rp: [],
        },
        {
          id: 2,
          fr: "Coordenação do Curso",
          sj: "Rematrícula 2027.1",
          bd: "A rematrícula abre em 1º de dezembro. Revise os pré-requisitos antes de montar sua grade.",
          tm: "Ontem",
          rd: 0,
          rp: [],
        },
        {
          id: 3,
          fr: "Profa. Camila Nogueira",
          sj: "Prorrogação da entrega",
          bd: "A entrega do projeto de Engenharia de Software foi prorrogada até 18/11. Não haverá nova prorrogação.",
          tm: "09/11",
          rd: 0,
          rp: [],
        },
        {
          id: 4,
          fr: "Secretaria Acadêmica",
          sj: "Atestado de matrícula emitido",
          bd: "Seu atestado já está disponível. Solicite novas vias pelo seu perfil.",
          tm: "10/11",
          rd: 1,
          rp: [],
        },
        {
          id: 5,
          fr: "Biblioteca Central",
          sj: "Livro disponível para retirada",
          bd: "O exemplar reservado de Arquitetura de Computadores chegou. Retire em até 3 dias.",
          tm: "07/11",
          rd: 1,
          rp: [],
        },
      ];
      let mid = 0;
      function msg() {
        const un = MG.filter((m) => !m.rd).length;
        $$(".mbg").forEach((el) => {
          el.textContent = un;
          el.style.display = un ? "grid" : "none";
        });
        const m = MG.find((x) => x.id === mid);
        $("#v-msg").innerHTML =
          `<div class="g3"><div class="card overflow-hidden self-start">${MG.map((x) => `<button data-mg="${x.id}" class="w-full text-left flex gap-3 p-4 border-b transition ${x.id === mid ? "bg-[#ebf5ff]" : "hover:bg-slate-50"}" style="border-color:var(--bd)"><span class="w-10 h-10 rounded-full bg-[#49BBBD]/15 text-[#218385] grid place-items-center font-bold flex-none">${x.fr.replace(/^Profa?\.\s/, "")[0]}</span><span class="min-w-0 flex-1 text-xs"><span class="flex justify-between gap-2"><b class="truncate ${x.rd ? "font-medium" : ""}">${x.fr}</b><small class="mu flex-none">${x.tm}</small></span><span class="block truncate ${x.rd ? "mu" : "font-semibold"}">${x.sj}</span></span>${x.rd ? "" : '<i class="w-2 h-2 mt-2 rounded-full bg-[#49BBBD] flex-none"></i>'}</button>`).join("")}</div><div class="card p-6 min-h-[260px]">${m ? `<small class="mu text-xs">${m.fr} · ${m.tm}</small><h3 class="text-xl font-extrabold mt-1">${m.sj}</h3><p class="my-4 text-sm">${m.bd}</p>${m.rp.map((r) => `<div class="p-3 rounded-2xl bg-[#ebf5ff] mb-2 ml-8 text-xs"><small class="mu block">Você · agora</small>${r}</div>`).join("")}<textarea id="rp" rows="3" class="in mt-3 text-xs" placeholder="Escreva sua resposta"></textarea><button class="btn p mt-3" id="sr">${ic("send")}Enviar resposta</button>` : '<p class="mu text-xs">Selecione uma mensagem para ler.</p>'}</div></div>`;
        $$("[data-mg]").forEach(
          (b) =>
            (b.onclick = () => {
              mid = +b.dataset.mg;
              MG.find((x) => x.id === mid).rd = 1;
              msg();
            }),
        );
        const sr = $("#sr");
        if (sr)
          sr.onclick = (e) => {
            const t = $("#rp").value.trim();
            if (!t) return toast("Escreva uma resposta antes de enviar", "er");
            ld(e.currentTarget, 1000, () => {
              m.rp.push(t);
              msg();
              toast("Resposta enviada a " + m.fr);
            });
          };
        ri();
      }

      // Notificações e Busca
      const NT = [
        ["Nota da P2 publicada em Banco de Dados", "há 2 h", "notas", 1],
        ["Boleto de novembro vence em 20/11", "há 1 dia", "fin", 1],
        ["Reserva disponível na biblioteca", "há 3 dias", "bib", 1],
        ["Rematrícula 2027.1 abre em 1º/12", "há 3 dias", "mat", 0],
      ];
      function nt() {
        const u = NT.filter((n) => n[3]).length;
        $("#bc").textContent = u;
        $("#bc").style.display = u ? "grid" : "none";
        $("#pp").innerHTML =
          `<div class="flex justify-between items-center px-4 py-3 border-b" style="border-color:var(--bd)"><b class="text-xs">Notificações</b><button class="text-[#49BBBD] text-xs font-bold" id="mr">Marcar como lidas</button></div>` +
          NT.map(
            (n, i) =>
              `<button data-nt="${i}" class="w-full text-left flex gap-3 px-4 py-3 border-b last:border-0 hover:bg-slate-50 transition text-xs" style="border-color:var(--bd)">${n[3] ? '<i class="w-2 h-2 mt-1.5 rounded-full bg-[#49BBBD] flex-none"></i>' : '<i class="w-2 flex-none"></i>'}<span>${n[0]}<small class="mu block">${n[1]}</small></span></button>`,
          ).join("");
        $("#mr").onclick = () => {
          NT.forEach((n) => (n[3] = 0));
          nt();
        };
        $$("[data-nt]").forEach(
          (b) =>
            (b.onclick = () => {
              const n = NT[b.dataset.nt];
              n[3] = 0;
              nt();
              $("#pp").classList.remove("o");
              go(n[2]);
            }),
        );
      }
      $("#bl").onclick = (e) => {
        e.stopPropagation();
        $("#pp").classList.toggle("o");
      };
      document.addEventListener("click", (e) => {
        if (!e.target.closest("#pp")) $("#pp").classList.remove("o");
      });

      function srch() {
        mod(
          `<input id="qi" class="in text-xs" placeholder="Buscar páginas, disciplinas e livros" autocomplete="off"><div id="qr" class="mt-3 max-h-80 overflow-auto"></div>`,
        );
        const IX = [
          ...V.map((v) => [v[1], "Página", v[2], () => go(v[0])]),
          ...CR.map((c, i) => [
            c.n,
            "Disciplina",
            "book-open",
            () => {
              go("notas");
              setTimeout(
                () =>
                  document
                    .getElementById("nc" + i)
                    .scrollIntoView({ behavior: "smooth", block: "center" }),
                50,
              );
            },
          ]),
          ...BK.map((b) => [
            b.t,
            "Livro",
            "library",
            () => {
              go("bib");
              bq = b.t;
              bib();
            },
          ]),
        ];
        const r = (q) => {
          const l = IX.filter((x) =>
            x[0].toLowerCase().includes(q.toLowerCase()),
          ).slice(0, 8);
          $("#qr").innerHTML =
            l
              .map(
                (x) =>
                  `<button data-i="${IX.indexOf(x)}" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-100 transition text-left text-xs"><span class="text-[#49BBBD]">${ic(x[2])}</span><span class="flex-1 font-medium">${x[0]}</span><small class="mu">${x[1]}</small></button>`,
              )
              .join("") || '<p class="mu p-2 text-xs">Nada encontrado.</p>';
          ri();
          $$("[data-i]").forEach(
            (b) =>
              (b.onclick = () => {
                cm();
                IX[b.dataset.i][3]();
              }),
          );
        };
        r("");
        $("#qi").oninput = (e) => r(e.target.value);
        $("#qi").onkeydown = (e) => {
          if (e.key === "Enter") {
            const b = $("[data-i]");
            if (b) b.click();
          }
        };
        $("#qi").focus();
      }
      $("#sk").onclick = srch;
      $("#a1b").onclick = () => go("perfil");
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          srch();
        }
      });

      agenda();
      fin();
      bib();
      msg();
      nt();
      dash();
      notas();
      mat();
      perfil();
      ri();
      const h = location.hash.slice(1);
      go(V.some((v) => v[0] === h) ? h : "dash");
    </script>
  </body>
</html>
